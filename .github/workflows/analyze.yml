
name: Mamba Code Analyzer

on:
  workflow_dispatch:

  push:
    paths:
      - "analyze.py"
      - "model_service.py"
      - "requirements.txt"
      - "input/**"
      - ".github/workflows/**"

jobs:
  preparation-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Check repository structure
        run: |
          echo "Checking repository..."

          test -f analyze.py
          test -f model_service.py
          test -f requirements.txt
          test -f input/sample.txt

          echo "Repository structure is OK."

      - name: Check Python files
        run: |
          python -m py_compile analyze.py
          python -m py_compile model_service.py

          echo "Python syntax is OK."

      - name: Show files
        run: |
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Check input file
        run: |
          echo "Input file:"
          echo "----------------------------------------"

          cat input/sample.txt

          echo "----------------------------------------"
          echo "Input file was read successfully."

      - name: Create test output
        run: |
          mkdir -p output

          echo "Mamba Code Analyzer" > output/output.txt
          echo "========================================" >> output/output.txt
          echo "" >> output/output.txt
          echo "Test workflow completed successfully." >> output/output.txt
          echo "Input file: input/sample.txt" >> output/output.txt

          echo "Test output created."

      - name: Display test output
        run: |
          echo "Generated output:"
          echo "----------------------------------------"

          cat output/output.txt

          echo "----------------------------------------"          

      - name: Upload analysis output
        uses: actions/upload-artifact@v4
        with:
          name: mamba-analysis-output
          path: output/output.txt
          if-no-files-found: error

      - name: Check Gradio application
        run: |
          python -m py_compile app_test.py
