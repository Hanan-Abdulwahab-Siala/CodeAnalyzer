name: Code Analyzer - Checks

on:

  push:

    branches:
      - main

    paths:
      - "*.py"
      - "requirements.txt"
      - "input/**"
      - ".github/workflows/**"


  pull_request:

    paths:
      - "*.py"
      - "requirements.txt"
      - "input/**"
      - ".github/workflows/**"


  workflow_dispatch:


jobs:

  checks:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Upgrade pip

        run: |

          python -m pip install --upgrade pip


      - name: Install dependencies

        run: |

          pip install -r requirements.txt

          pip install torch \
            --index-url \
            https://download.pytorch.org/whl/cpu


      - name: Compile Python files

        run: |

          python -m py_compile analyze.py

          python -m py_compile app.py

          python -m py_compile app_test.py

          python -m py_compile model_service.py


      - name: Check repository structure

        run: |

          test -f analyze.py

          test -f app.py

          test -f app_test.py

          test -f model_service.py

          test -f requirements.txt

          test -f input/sample.txt

          test -f output/.gitkeep


      - name: Check sample input

        run: |

          test -s input/sample.txt

      - name: Check sample input

        run: |

          test -s input/sample.py

      - name: Create CI output

        run: |

          mkdir -p output

          echo "Code Analyzer" \
            > output/output.txt

          echo "========================================" \
            >> output/output.txt

          echo "GitHub Actions checks completed." \
            >> output/output.txt

          echo "No model inference was performed." \
            >> output/output.txt

          echo "No GPU was required." \
            >> output/output.txt


      - name: Upload CI artifact

        uses: actions/upload-artifact@v4

        with:

          name: code-analyzer-ci-output

          path: output/output.txt

          if-no-files-found: error
